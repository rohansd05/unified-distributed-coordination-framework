# Serves the built frontend and proxies the backend, so the browser talks to one origin (localhost:5173).
server {
    listen 80;
    root /usr/share/nginx/html;

    # Client-side routes fall back to index.html (as frontend/vercel.json does on Vercel).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        # Keep the browser's host, so the backend sees the same origin the page came from.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Experiment 8 failover and scenario steps can take several seconds.
        proxy_read_timeout 60s;
    }

    # STOMP over WebSocket.
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
