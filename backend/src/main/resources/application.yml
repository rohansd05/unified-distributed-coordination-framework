# Shared configuration for every instance.
# Node identity lives in the profile files so one codebase can run as many nodes.

spring:
  application:
    name: udcf-backend
  profiles:
    default: node1

server:
  port: ${udcf.node.port:8081}

udcf:
  threadpool:
    core-pool-size: 4
    max-pool-size: 8
    queue-capacity: 200
    keep-alive-seconds: 60
    thread-name-prefix: udcf-worker-
    metrics-window-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        distributed_request_duration: true

logging:
  level:
    com.udcf: INFO
