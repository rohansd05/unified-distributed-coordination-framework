# Shared configuration. Profiles: local (default, full system) and public (lite deployment).

spring:
  application:
    name: udcf-backend
  profiles:
    default: local

server:
  port: ${PORT:8080}

udcf:
  events:
    buffer-size: 5000
    dispatch-queue-size: 1024
  cluster:
    size: 5
    capacity-pattern: [FAST, MEDIUM, SLOW, MEDIUM, FAST]
    ports:
      rmi-base: 1100
      clock-base: 6000
      election-base: 7000
      replication-base: 7100
      requests-base: 7200
      mapreduce-base: 7300
  web:
    allowed-origins: ${UDCF_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  system:
    version: "@project.version@"
    mode: local
  # Experiment 2 (lab 2). Thread counts come from each node's capacity (FAST 4, MEDIUM 2, SLOW 1).
  multithreading:
    queue-capacity: 200
    keep-alive-seconds: 60
    thread-name-prefix: udcf-worker-
    metrics-window-seconds: 30
    request-history-size: 500
    read-timeout-millis: 5000
    # The demo sends threads + queue capacity + extra-requests as one burst, so it always rejects some.
    backpressure:
      extra-requests: 50
      workload: CPU_HASH
      payload-size: 200
  # Experiment 3 (lab 3). Clock synchronization (Lamport logical clock and Berkeley physical clock).
  clocksync:
    poll-timeout-millis: 1000
    outlier-threshold-millis: 500
    default-traffic-seconds: 5
    max-traffic-seconds: 30
    default-messages-per-second: 4
    max-messages-per-second: 20
    retained-events-capacity: 2000
    nodes:
      1:
        initial-offset-millis: 0
        drift-rate-ms-per-sec: 0.0
      2:
        initial-offset-millis: 40
        drift-rate-ms-per-sec: 1.5
      3:
        initial-offset-millis: -30
        drift-rate-ms-per-sec: -1.0
      4:
        initial-offset-millis: 25
        drift-rate-ms-per-sec: 0.8
      5:
        initial-offset-millis: -20
        drift-rate-ms-per-sec: -0.5
  # Experiment 4 (lab 4). Bully and Ring election over UDP 700k (Appendix B timings). The same socket
  # carries the shared failure detector's heartbeats (link L2).
  election:
    ok-timeout-millis: 900
    coordinator-timeout-millis: 2200
    probe-timeout-millis: 300
    # Not in Appendix B. Worst case with 2 of 5 nodes alive is about 1.8 s (3 skips x 300 ms, on both passes).
    ring-completion-timeout-millis: 5000
    heartbeat-interval-millis: 700
    heartbeat-timeout-millis: 2500
    # ElectionModule: a round not agreed within this is closed as TIMED_OUT and not measured.
    round-timeout-millis: 10000
  # Experiment 5 (lab 5). Replication over TCP 710k; the primary is the lowest live node until Phase 9A (L1).
  replication:
    # SIMULATED (R7): stands in for wide-area latency on asynchronous pushes only (Appendix B: 450 ms).
    async-delay-millis: 450
    # Connect and read timeout of every replication exchange, client and server (legacy 1500 ms).
    timeout-millis: 1500
    # Items per anti-entropy message and per dump page, 1 to 1000 (the protocol limit).
    batch-size: 200
  # Experiment 6 (lab 6). The balancer dispatches into each node's Exp 2 requests service (link L3).
  loadbalancing:
    # Connect and read timeout per attempt; the read also covers the worker's queue wait.
    request-timeout-millis: 10000
    # Appendix B: 60 requests and 12 concurrent clients; 400 work units (Exp 2 payload) from the E6b probe.
    defaults:
      request-count: 60
      work-units: 400
      concurrency: 12
    # max-total-work caps requestCount x workUnits per run, and 5 x that for a comparison (4 phases + warm-up).
    limits:
      max-request-count: 1000
      max-work-units: 5000
      max-concurrency: 50
      max-total-work: 500000
  # Experiment 7 (lab 7). MapReduce workers over TCP 730k (Appendix B timings).
  mapreduce:
    task-timeout-millis: 15000
    socket-read-timeout-millis: 15000
    max-request-bytes: 4194304
    listen-backlog: 50
    worker-threads: 4
    queue-capacity: 32

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: udcf
      mode: ${udcf.system.mode}
    distribution:
      percentiles-histogram:
        distributed_request_duration: true

logging:
  level:
    com.udcf: INFO
