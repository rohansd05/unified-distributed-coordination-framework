# Shared configuration. Profiles: local (default, full system) and public (lite deployment).

spring:
  application:
    name: udcf-backend
  profiles:
    default: local

server:
  port: ${PORT:8080}

udcf:
  events:
    buffer-size: 5000
    dispatch-queue-size: 1024
  cluster:
    size: 5
    capacity-pattern: [FAST, MEDIUM, SLOW, MEDIUM, FAST]
    ports:
      rmi-base: 1100
      clock-base: 6000
      election-base: 7000
      replication-base: 7100
      requests-base: 7200
      mapreduce-base: 7300
  web:
    allowed-origins: ${UDCF_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  system:
    version: "@project.version@"
    mode: local
  # Experiment 1 (lab 1). Java RMI: every node's registry on 110k exports a NodeEndpoint (from E1b).
  rmi:
    # Most SHA-256 rounds one computeHash call may ask for.
    max-hash-rounds: 1000000
    # Longest echo text, in UTF-16 characters.
    max-echo-length: 1024
    # Calls the module keeps for the page (E1c).
    history-size: 50
    # Connect and response timeout of one RMI call (E1b); above the longest computeHash.
    call-timeout-millis: 3000
    # Longest failure message kept in a call result; a longer one is cut and ends with an ellipsis.
    max-failure-message-length: 300
    # E1b transport: connect timeout of every RMI client socket (call-timeout-millis is its read timeout).
    connect-timeout-millis: 1000
    # Backlog of each node's RMI listener.
    listen-backlog: 50
    # JEP 290 limits for the arguments a node reads (a normal call: depth 1, 2 references, 74 bytes).
    serial-filter:
      max-depth: 5
      max-refs: 20
      max-bytes: 16384
      max-array: 16
  # Experiment 2 (lab 2). Thread counts come from each node's capacity (FAST 4, MEDIUM 2, SLOW 1).
  multithreading:
    queue-capacity: 200
    keep-alive-seconds: 60
    thread-name-prefix: udcf-worker-
    metrics-window-seconds: 30
    request-history-size: 500
    read-timeout-millis: 5000
    # The demo sends threads + queue capacity + extra-requests as one burst, so it always rejects some.
    backpressure:
      extra-requests: 50
      workload: CPU_HASH
      payload-size: 200
  # Experiment 3 (lab 3). Clock synchronization (Lamport logical clock and Berkeley physical clock).
  clocksync:
    poll-timeout-millis: 1000
    outlier-threshold-millis: 500
    default-traffic-seconds: 5
    max-traffic-seconds: 30
    default-messages-per-second: 4
    max-messages-per-second: 20
    retained-events-capacity: 2000
    nodes:
      1:
        initial-offset-millis: 0
        drift-rate-ms-per-sec: 0.0
      2:
        initial-offset-millis: 40
        drift-rate-ms-per-sec: 1.5
      3:
        initial-offset-millis: -30
        drift-rate-ms-per-sec: -1.0
      4:
        initial-offset-millis: 25
        drift-rate-ms-per-sec: 0.8
      5:
        initial-offset-millis: -20
        drift-rate-ms-per-sec: -0.5
  # Experiment 4 (lab 4). Bully and Ring election over UDP 700k (Appendix B timings). The same socket
  # carries the shared failure detector's heartbeats (link L2).
  election:
    ok-timeout-millis: 900
    coordinator-timeout-millis: 2200
    probe-timeout-millis: 300
    # Not in Appendix B. Worst case with 2 of 5 nodes alive is about 1.8 s (3 skips x 300 ms, on both passes).
    ring-completion-timeout-millis: 5000
    heartbeat-interval-millis: 700
    heartbeat-timeout-millis: 2500
    # ElectionModule: a round not agreed within this is closed as TIMED_OUT and not measured.
    round-timeout-millis: 10000
  # Experiment 5 (lab 5). Replication over TCP 710k; the primary is the lowest live node until Phase 9A (L1).
  replication:
    # SIMULATED (R7): stands in for wide-area latency on asynchronous pushes only (Appendix B: 450 ms).
    async-delay-millis: 450
    # Connect and read timeout of every replication exchange, client and server (legacy 1500 ms).
    timeout-millis: 1500
    # Items per anti-entropy message and per dump page, 1 to 1000 (the protocol limit).
    batch-size: 200
  # Experiment 6 (lab 6). The balancer dispatches into each node's Exp 2 requests service (link L3).
  loadbalancing:
    # Connect and read timeout per attempt; the read also covers the worker's queue wait.
    request-timeout-millis: 10000
    # Appendix B: 60 requests and 12 concurrent clients; 400 work units (Exp 2 payload) from the E6b probe.
    defaults:
      request-count: 60
      work-units: 400
      concurrency: 12
    # max-total-work caps requestCount x workUnits per run, and 5 x that for a comparison (4 phases + warm-up).
    limits:
      max-request-count: 1000
      max-work-units: 5000
      max-concurrency: 50
      max-total-work: 500000

  # Experiment 7 (lab 7). MapReduce workers over TCP 730k (Appendix B timings).
  mapreduce:
    task-timeout-millis: 15000
    socket-read-timeout-millis: 15000
    max-request-bytes: 4194304
    listen-backlog: 50
    worker-threads: 4
    queue-capacity: 32
    # E7c module and API. upload-max-bytes is also the byte cap of the event-log input. It must be at
    # most a quarter of max-request-bytes (checked at startup): intermediate data can reach about 3.7x
    # the input in one wire line (arithmetic in docs/tracks/track-d-rohan.md).
    upload-max-bytes: 1048576
    result-rows-max: 200
    run-history-size: 20
    # POST /runs body limit = Base64 size of upload-max-bytes + this allowance; larger bodies get 413.
    request-body-allowance-bytes: 8192

  # Experiment 8 (lab 8). Failover on the replication service (TCP 710k) and the shared failure
  # detector (link L2: timings are udcf.election.heartbeat-*). The client must outlast the worst
  # failover: detection (2500 + 700) + 2 x promotion attempt (catch-up 1000 + term record 2 x 1500)
  # = 3200 + 2 x 4000 = 11200 ms. Retry window 50 x 250 = 12500 ms, 11.6 % above it.
  faulttolerance:
    client:
      max-attempts: 50
      retry-delay-millis: 250
    # A recovering node whose role query got no answer asks again; it stays non-primary meanwhile.
    role-query:
      retry-delay-millis: 1000
      max-attempts: 5
    promotion:
      # The chosen node's catch-up from the other live peers (in parallel); a peer not done is skipped.
      catch-up-timeout-millis: 1000
    history-limit: 10

  # Experiment 9 (lab 9). MPI collectives over the Experiment 1 RMI layer (E9a model; E9b transport).
  mpi:
    # Longest vector a collective may move; also the array limit of E9b's serial filter.
    max-payload-elements: 100000
    # No new transfer starts once this much time has passed; the rest are NOT_ATTEMPTED. A transfer already
    # running is bounded by the RMI timeouts, so one HTTP call can last up to about 22 s (deadline + one transfer).
    collective-deadline-millis: 10000
    # Collectives the module keeps for the page (E9c).
    history-size: 20
    # Received payloads each node keeps by collective id (8 x 800 KB at most per node locally).
    receive-store-size: 8
    # Longest failure message kept in a transfer record; as udcf.rmi.
    max-failure-message-length: 300
    

  # Experiment 10 (lab 10). Parallel matrix multiplication (E10a model). There is no maximum size here: it is
  # floor(sqrt(udcf.mpi.max-payload-elements)), so B (N x N) fits one broadcast: 316 here, 100 in public.
  matrix:
    # Smallest N a run accepts; N below the number of live nodes is refused separately.
    min-size: 2
    # Sizes of the speedup series: at least three, strictly ascending, each from min-size to the maximum.
    series-sizes: [50, 100, 200, 316]
    # E10b: untimed full products at the run's size before the timed sequential product (JIT warm-up); 0 allowed.
    warmup-products: 1
    # E10b: longest a node waits for its block's multiply on its Exp 2 executor, queue wait included. Must stay
    # below udcf.rmi.call-timeout-millis (checked at startup), so a node always answers before the caller gives up.
    compute-timeout-millis: 2000
    # E10b: computed blocks of C each node keeps by run id until the root fetches them; the oldest is dropped.
    result-store-size: 4

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: udcf
      mode: ${udcf.system.mode}
    distribution:
      percentiles-histogram:
        distributed_request_duration: true

logging:
  level:
    com.udcf: INFO
