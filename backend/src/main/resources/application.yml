# Shared configuration. Profiles: local (default, full system) and public (lite deployment).

spring:
  application:
    name: udcf-backend
  profiles:
    default: local

server:
  port: ${PORT:8080}

udcf:
  events:
    buffer-size: 5000
    dispatch-queue-size: 1024
  cluster:
    size: 5
    capacity-pattern: [FAST, MEDIUM, SLOW, MEDIUM, FAST]
    ports:
      rmi-base: 1100
      clock-base: 6000
      election-base: 7000
      replication-base: 7100
      requests-base: 7200
      mapreduce-base: 7300
  web:
    allowed-origins: ${UDCF_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  system:
    version: "@project.version@"
    mode: local
  # Experiment 2 (lab 2). Thread counts come from each node's capacity (FAST 4, MEDIUM 2, SLOW 1).
  multithreading:
    queue-capacity: 200
    keep-alive-seconds: 60
    thread-name-prefix: udcf-worker-
    metrics-window-seconds: 30
    request-history-size: 500
    read-timeout-millis: 5000
    # The demo sends threads + queue capacity + extra-requests as one burst, so it always rejects some.
    backpressure:
      extra-requests: 50
      workload: CPU_HASH
      payload-size: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: udcf
      mode: ${udcf.system.mode}
    distribution:
      percentiles-histogram:
        distributed_request_duration: true

logging:
  level:
    com.udcf: INFO
