# Shared configuration for every instance.
# Node identity lives in the profile files so one codebase can run as many nodes.

spring:
  application:
    name: udcf-backend
  profiles:
    default: node1

server:
  port: ${udcf.node.port:8081}

udcf:
  threadpool:
    core-pool-size: 4
    max-pool-size: 8
    queue-capacity: 200
    keep-alive-seconds: 60
    thread-name-prefix: udcf-worker-
    metrics-window-seconds: 30
  events:
    buffer-size: 5000
    dispatch-queue-size: 1024
  cluster:
    size: 5
    capacity-pattern: [FAST, MEDIUM, SLOW, MEDIUM, FAST]
    ports:
      rmi-base: 1100
      clock-base: 6000
      election-base: 7000
      replication-base: 7100
      requests-base: 7200
      mapreduce-base: 7300
  web:
    allowed-origins: ${UDCF_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  system:
    version: "@project.version@"
    mode: local

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        distributed_request_duration: true

logging:
  level:
    com.udcf: INFO
