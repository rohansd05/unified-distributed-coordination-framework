# Public lite deployment (Render free tier, docs/HANDOFF.md 6.10). JVM flags are set in the Dockerfile (Step 2.5).
udcf:
  system:
    mode: public
  cluster:
    size: 3          # the capacity pattern is unchanged, so nodes are FAST, MEDIUM, SLOW
  events:
    buffer-size: 1500
  multithreading:
    queue-capacity: 100
  clocksync:
    default-traffic-seconds: 5
    max-traffic-seconds: 15
    default-messages-per-second: 4
    max-messages-per-second: 10
    retained-events-capacity: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

