# Public lite deployment (Render free tier, docs/HANDOFF.md 6.10). JVM flags are set in the Dockerfile (Step 2.5).
udcf:
  system:
    mode: public
  cluster:
    size: 3          # the capacity pattern is unchanged, so nodes are FAST, MEDIUM, SLOW
  events:
    buffer-size: 1500
  multithreading:
    queue-capacity: 100
  clocksync:
    default-traffic-seconds: 5
    max-traffic-seconds: 15
    default-messages-per-second: 4
    max-messages-per-second: 10
    retained-events-capacity: 1000
  # Smaller for 0.1 CPU: a default comparison (5 x 60 x 400 = 120000 units) is estimated at about
  # 10 s there, and the SLOW node's worst queue wait stays well under the 10 s timeout.
  loadbalancing:
    limits:
      max-request-count: 200
      max-work-units: 500
      max-concurrency: 24
      max-total-work: 120000
  # Smaller max-request-bytes for 512 MB RAM (docs/tracks/README.md Section 5).
  mapreduce:
    max-request-bytes: 1048576
    # A quarter of max-request-bytes (the startup check), so every task fits one wire line.
    upload-max-bytes: 262144

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

