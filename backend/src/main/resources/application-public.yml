# Public lite deployment (Render free tier, docs/HANDOFF.md 6.10). JVM flags are set in the Dockerfile (Step 2.5).
udcf:
  system:
    mode: public
  cluster:
    size: 3          # the capacity pattern is unchanged, so nodes are FAST, MEDIUM, SLOW
  events:
    buffer-size: 1500
  threadpool:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 100
  multithreading:
    queue-capacity: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

